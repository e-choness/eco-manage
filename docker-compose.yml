x-workspace: &workspace
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: ecomanage-dev
  working_dir: /repo
  volumes:
    - .:/repo
    - /repo/node_modules
    - /repo/apps/api/node_modules
    - /repo/apps/web/node_modules

services:
  api:
    <<: *workspace
    command: ["pnpm", "--filter", "@ecomanage/api", "dev"]
    ports:
      - "3000:3000"
    env_file: ./apps/api/.env
    environment:
      DATABASE_URL: mongodb://mongodb:27017/ecomanage
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  web:
    <<: *workspace
    command: ["pnpm", "--filter", "@ecomanage/web", "dev"]
    ports:
      - "5173:5173"
    depends_on:
      - api

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo-seed:
    <<: *workspace
    command: ["pnpm", "--filter", "@ecomanage/api", "seed"]
    env_file: ./apps/api/.env
    environment:
      DATABASE_URL: mongodb://mongodb:27017/ecomanage
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"

volumes:
  mongo_data:
