# Development stack. Run from the repo root (`docker compose up -d`; the root compose file
# includes this one) or with `docker compose -f infra/docker-compose.yml`.
name: ecomanage

x-workspace: &workspace
  build:
    context: ..
    dockerfile: Dockerfile.dev
  image: ecomanage-dev
  working_dir: /repo
  volumes:
    - ..:/repo
    - /repo/node_modules
    - /repo/apps/api/node_modules
    - /repo/apps/web/node_modules
    - /repo/packages/shared/node_modules
    - /repo/packages/db/node_modules
    - /repo/packages/profiles/node_modules
    - /repo/packages/recs/node_modules
    - /repo/apps/simulator/node_modules
    - /repo/apps/ingest/node_modules
    - /repo/apps/worker/node_modules
    - /repo/apps/rules/node_modules
    - /repo/apps/modelconv/node_modules
    - /repo/apps/gateway/node_modules
    - /repo/docs/node_modules
  environment: &workspace-env
    # Windows bind mounts don't deliver file events reliably, so the watchers poll.
    CHOKIDAR_USEPOLLING: "true"
    CHOKIDAR_INTERVAL: "1000"

x-api-env: &api-env
  env_file:
    - path: ../apps/api/.env.example
    - path: ../apps/api/.env
      required: false

services:
  api:
    <<: [*workspace, *api-env]
    command: ["pnpm", "--filter", "@ecomanage/api", "dev"]
    ports:
      - "3000:3000"
    environment:
      <<: *workspace-env
      DATABASE_URL: mongodb://mongodb:27017/ecomanage
      REDIS_URL: redis://redis:6379
      MQTT_URL: mqtts://mosquitto:8883
      # Explanations (P5-05): owners add their own key in Settings → Rules; a server default is
      # optional (LLM_* or ANTHROPIC_API_KEY from the shell).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # 3D models (P5-02): originals go to object storage; processed models are served from /cdn.
      S3_ENDPOINT: http://objects:9000
      S3_BUCKET: ecomanage-assets
      S3_ACCESS_KEY: ecomanage
      S3_SECRET_KEY: ecomanage-dev-secret
      ASSET_PUBLIC_URL: /cdn
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      objects-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  web:
    <<: *workspace
    command: ["pnpm", "--filter", "@ecomanage/web", "dev"]
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # MQTT → telemetry time series (MongoDB) + latest values (Redis).
  ingest:
    <<: *workspace
    command: ["pnpm", "--filter", "@ecomanage/ingest", "dev"]
    environment:
      <<: *workspace-env
      DATABASE_URL: mongodb://mongodb:27017/ecomanage
      REDIS_URL: redis://redis:6379
      MQTT_URL: mqtts://mosquitto:8883
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  # BullMQ jobs: prices new intervals every minute and keeps the bills up to date.
  worker:
    <<: *workspace
    command: ["pnpm", "--filter", "@ecomanage/worker", "dev"]
    environment:
      <<: *workspace-env
      DATABASE_URL: mongodb://mongodb:27017/ecomanage
      REDIS_URL: redis://redis:6379
      SMTP_URL: smtp://mailpit:1025
      APP_URL: http://localhost:5173
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-simulated}
      WEATHER_SEED: ${SIM_SEED:-42}
      GOTENBERG_URL: http://gotenberg:3000
      MODELCONV_URL: http://modelconv:3100
      S3_ENDPOINT: http://objects:9000
      S3_BUCKET: ecomanage-assets
      S3_ACCESS_KEY: ecomanage
      S3_SECRET_KEY: ecomanage-dev-secret
      ASSET_PUBLIC_URL: /cdn
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      gotenberg:
        condition: service_started
      objects-setup:
        condition: service_completed_successfully
      modelconv:
        condition: service_started
    # The only service on the converter's internal network.
    networks: [default, convert]
    restart: unless-stopped

  # Alert checks on every reading (P2-07); recommendations follow in Phase 3.
  rules:
    <<: *workspace
    command: ["pnpm", "--filter", "@ecomanage/rules", "dev"]
    environment:
      <<: *workspace-env
      DATABASE_URL: mongodb://mongodb:27017/ecomanage
      REDIS_URL: redis://redis:6379
      MQTT_URL: mqtts://mosquitto:8883
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  # Simulated Maple Grove School site: behaves exactly like its gateway over MQTT/TLS.
  # Speed and seed: SIM_SPEED (1–60), SIM_SEED. Control API: http://localhost:4100/sim/state
  simulator:
    <<: *workspace
    command: ["pnpm", "--filter", "@ecomanage/simulator", "dev"]
    ports:
      - "4100:4100"
    # Lists replace (not merge) the anchor's, so the workspace mounts are repeated here.
    volumes:
      - ..:/repo
      - /repo/node_modules
      - /repo/apps/api/node_modules
      - /repo/apps/web/node_modules
      - /repo/packages/shared/node_modules
      - /repo/packages/db/node_modules
      - /repo/packages/profiles/node_modules
      - /repo/packages/recs/node_modules
      - /repo/apps/simulator/node_modules
      - /repo/apps/ingest/node_modules
      - /repo/apps/worker/node_modules
      - /repo/apps/rules/node_modules
      - /repo/apps/modelconv/node_modules
      - /repo/apps/gateway/node_modules
      - simulator_state:/state
    environment:
      <<: *workspace-env
      SIM_SPEED: ${SIM_SPEED:-1}
      SIM_SEED: ${SIM_SEED:-42}
      MQTT_URL: mqtts://mosquitto:8883
      SIM_STATE_FILE: /state/simulator.json
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4100/sim/state"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # Prints report PDFs from HTML (P5-01): headless Chromium in its own container, JavaScript off,
  # and Chromium may open only its own temporary files, so report text can't make it fetch anything.
  gotenberg:
    image: gotenberg/gotenberg:8.37.0
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=^file:///tmp/.*
      - --api-timeout=60s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # S3-compatible object storage for 3D models (P5-02). Processed models are public under
  # `models/` (the web app reaches them through /cdn, standing in for a CDN); originals under
  # `uploads/` are private. RustFS (Apache 2.0); any S3 store works. Console on :9001.
  objects:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ecomanage
      RUSTFS_SECRET_KEY: ecomanage-dev-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9001:9001"
    volumes:
      - objects_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One-shot: the bucket, with anonymous reads for processed models only (plain S3 calls).
  objects-setup:
    <<: *workspace
    command: ["node", "packages/db/scripts/setup-bucket.mjs"]
    environment:
      S3_ENDPOINT: http://objects:9000
      S3_BUCKET: ecomanage-assets
      S3_ACCESS_KEY: ecomanage
      S3_SECRET_KEY: ecomanage-dev-secret
    depends_on:
      objects:
        condition: service_healthy
    restart: "no"

  # Converts and compresses uploaded 3D models (P5-02) in a sandbox: its own image with assimp,
  # IfcOpenShell and toktx, a read-only file system (scratch space in /tmp only), no capabilities,
  # a non-root user, limited memory, CPU and processes, and an internal network that reaches
  # nothing but the worker. It never sees the database, Redis or storage.
  modelconv:
    build:
      context: ..
      dockerfile: apps/modelconv/Dockerfile
    image: ecomanage-modelconv
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 3g
    cpus: 2
    networks: [convert]
    volumes:
      # Development: code changes without a rebuild (read-only).
      - ../apps/modelconv/src:/repo/apps/modelconv/src:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Catches every email in development (P2-09): web UI and API at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 2000
    restart: unless-stopped

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  mqtt-certs:
    image: alpine:3.24
    command: ["sh", "/gen-certs.sh"]
    environment:
      # Space-separated site ids that get a gateway certificate (CN = site id).
      GATEWAY_SITES: ${GATEWAY_SITES:-650000000000000000000001}
    volumes:
      - ./mosquitto/gen-certs.sh:/gen-certs.sh:ro
      - ./mosquitto/certs:/certs
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    ports:
      # 8883 falls in a Windows reserved port range on some hosts, so the host side is 18883.
      - "${MQTT_HOST_PORT:-18883}:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
    depends_on:
      mqtt-certs:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - mosquitto_sub
        - -h
        - localhost
        - -p
        - "8883"
        - --cafile
        - /mosquitto/certs/ca.crt
        - --cert
        - /mosquitto/certs/svc-health.crt
        - --key
        - /mosquitto/certs/svc-health.key
        - -t
        - $$SYS/broker/uptime
        - -C
        - "1"
        - -W
        - "3"
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Playwright smoke test against the running stack: `docker compose --profile e2e run --rm e2e`
  # (seed first: `docker compose run --rm mongo-seed`). Reports land in e2e/playwright-report.
  e2e:
    build:
      context: ../e2e
    profiles: ["e2e"]
    environment:
      E2E_BASE_URL: http://web:5173
      CI: ${CI:-}
    volumes:
      - ../e2e/playwright-report:/tests/playwright-report
      - ../e2e/test-results:/tests/test-results
    depends_on:
      web:
        condition: service_healthy
      simulator:
        condition: service_healthy
      ingest:
        condition: service_started
    restart: "no"

  # The reference gateway agent (P5-04) against stand-in devices: `docker compose --profile
  # gateway up -d`. It starts unclaimed, with only the bootstrap certificate; register it first
  # (docs/GATEWAY.md) and claim it in Settings → Site. Its state (buffer, key, certificate) lives
  # in the gateway_data volume, like the SD card of a real one.
  gateway:
    <<: *workspace
    command: ["pnpm", "--filter", "@ecomanage/gateway", "dev"]
    profiles: ["gateway"]
    volumes:
      - ..:/repo
      - /repo/node_modules
      - /repo/apps/gateway/node_modules
      - /repo/packages/shared/node_modules
      - /repo/packages/profiles/node_modules
      - gateway_data:/var/lib/ecomanage-gateway
    environment:
      <<: *workspace-env
      GATEWAY_CONFIG: /repo/infra/gateway/gateway.json
      GATEWAY_FACTORY: /repo/infra/gateway/factory.json
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  # Stand-ins for the bench hardware: a SunSpec inverter (Modbus TCP 502), a CT meter (1503) and
  # an OCPP charger that connects to the gateway.
  gateway-devices:
    <<: *workspace
    command: ["pnpm", "--filter", "@ecomanage/gateway", "fake-devices"]
    profiles: ["gateway"]
    volumes:
      - ..:/repo
      - /repo/node_modules
      - /repo/apps/gateway/node_modules
      - /repo/packages/shared/node_modules
      - /repo/packages/profiles/node_modules
    restart: unless-stopped

  # The documentation site (VitePress): `docker compose --profile docs up -d docs`, then
  # http://localhost:5174/eco-manage/. Published to GitHub Pages by .github/workflows/docs.yml.
  docs:
    <<: *workspace
    command: ["pnpm", "--filter", "@ecomanage/docs", "dev"]
    profiles: ["docs"]
    ports:
      - "5174:5174"
    restart: unless-stopped

  # One-shot: resets the demo accounts and data. Not started by `up`; run it with
  # `docker compose run --rm mongo-seed`.
  mongo-seed:
    <<: [*workspace, *api-env]
    command: ["pnpm", "--filter", "@ecomanage/api", "seed"]
    profiles: ["tools"]
    environment:
      <<: *workspace-env
      DATABASE_URL: mongodb://mongodb:27017/ecomanage
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"

volumes:
  mongo_data:
  objects_data:
  mosquitto_data:
  simulator_state:
  gateway_data:

networks:
  default:
  # The model converter's only network: internal (no internet), shared with the worker alone.
  convert:
    internal: true
