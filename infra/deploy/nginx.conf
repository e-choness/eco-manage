# The web app, and the API and processed 3D models behind it, on one origin. Cloudflare Tunnel
# (or any HTTPS proxy) sits in front and talks plain HTTP to port 80.

# Visitors' addresses, for the API's rate limits: Cloudflare puts them in CF-Connecting-IP, and
# only the tunnel and the host (the Docker networks) are trusted to set it.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;

  # Site model uploads are up to 30 MB.
  client_max_body_size 32m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The API trusts one proxy hop: this one, with the visitor's address alone.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Home's live stream (server-sent events) must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Processed 3D models only (public in the bucket); originals under uploads/ stay private.
  location /cdn/models/ {
    limit_except GET { deny all; }
    proxy_pass http://objects:9000/ecomanage-assets/models/;
    proxy_http_version 1.1;
    expires 1h;
  }

  # Hashed build files never change.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
}
