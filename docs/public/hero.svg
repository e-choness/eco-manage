<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">EcoManage</title>
  <desc id="d">Energy flowing between solar, battery, grid, EV chargers and a heat pump through a building's switchboard.</desc>
  <style>
    :root { --bg: #0b1120; --panel: #101a2e; --line: #19243c; --tx: #e8ecf4; --sb: #8d9bb5; --node: #1a2439; --edge: #3b4f78; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f6f8fb; --panel: #ffffff; --line: #e1e6ee; --tx: #172031; --sb: #566174; --node: #ffffff; --edge: #b4bcc9; }
    }
    .bg { fill: var(--bg); }
    .grid { stroke: var(--line); stroke-width: 1; }
    .title { fill: var(--tx); font: 700 56px system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -1px; }
    .tag { fill: var(--sb); font: 400 21px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chip { fill: var(--panel); stroke: var(--line); }
    .chiptx { fill: var(--sb); font: 500 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .node { fill: var(--node); stroke: var(--edge); stroke-width: 1.5; }
    .lbl { fill: var(--sb); font: 500 13px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
    .kw { fill: var(--tx); font: 600 15px ui-monospace, "SFMono-Regular", Menlo, monospace; text-anchor: middle; }
    .path { fill: none; stroke-width: 2; opacity: .28; }
    .live { fill: #3ecf8e; }
  </style>

  <rect class="bg" width="1200" height="380" rx="18"/>
  <g opacity=".6">
    <path class="grid" d="M0 95H1200M0 190H1200M0 285H1200M600 0V380M750 0V380M900 0V380M1050 0V380"/>
  </g>

  <!-- Left: name, what it does, and a live marker -->
  <text class="title" x="64" y="150">EcoManage</text>
  <text class="tag" x="66" y="192">Energy management for buildings with solar,</text>
  <text class="tag" x="66" y="220">batteries, EV chargers and heat pumps.</text>
  <g transform="translate(66 256)">
    <rect class="chip" width="160" height="34" rx="17"/>
    <circle class="live" cx="20" cy="17" r="5">
      <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text class="chiptx" x="34" y="22">live, every 5 s</text>
  </g>
  <g transform="translate(240 256)">
    <rect class="chip" width="206" height="34" rx="17"/>
    <text class="chiptx" x="18" y="22">approve before it acts</text>
  </g>

  <!-- Right: the site's flows into and out of the switchboard -->
  <defs>
    <path id="pv"  d="M760 70 C 800 120, 860 140, 900 190"/>
    <path id="bat" d="M650 250 C 720 250, 820 240, 900 190"/>
    <path id="grd" d="M1110 80 C 1060 120, 960 150, 900 190"/>
    <path id="ev"  d="M900 190 C 950 240, 1020 280, 1090 300"/>
    <path id="hp"  d="M900 190 C 880 250, 820 300, 760 320"/>
  </defs>
  <use href="#pv"  class="path" stroke="#f2b33d"/>
  <use href="#bat" class="path" stroke="#3ecf8e"/>
  <use href="#grd" class="path" stroke="#5b9dff"/>
  <use href="#ev"  class="path" stroke="#b48cff"/>
  <use href="#hp"  class="path" stroke="#ff7a59"/>

  <!-- Particles: into the switchboard from solar, battery and grid; out to the loads -->
  <g>
    <circle r="5" fill="#f2b33d"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#pv"/></animateMotion></circle>
    <circle r="5" fill="#f2b33d"><animateMotion dur="2.4s" begin="-0.8s" repeatCount="indefinite"><mpath href="#pv"/></animateMotion></circle>
    <circle r="5" fill="#f2b33d"><animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite"><mpath href="#pv"/></animateMotion></circle>
    <circle r="4.5" fill="#3ecf8e"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#bat"/></animateMotion></circle>
    <circle r="4.5" fill="#3ecf8e"><animateMotion dur="3.2s" begin="-1.6s" repeatCount="indefinite"><mpath href="#bat"/></animateMotion></circle>
    <circle r="4.5" fill="#5b9dff"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#grd"/></animateMotion></circle>
    <circle r="4.5" fill="#5b9dff"><animateMotion dur="2.8s" begin="-1.4s" repeatCount="indefinite"><mpath href="#grd"/></animateMotion></circle>
    <circle r="4.5" fill="#b48cff"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#ev"/></animateMotion></circle>
    <circle r="4.5" fill="#b48cff"><animateMotion dur="2.6s" begin="-1.3s" repeatCount="indefinite"><mpath href="#ev"/></animateMotion></circle>
    <circle r="4.5" fill="#ff7a59"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#hp"/></animateMotion></circle>
    <circle r="4.5" fill="#ff7a59"><animateMotion dur="3s" begin="-1.5s" repeatCount="indefinite"><mpath href="#hp"/></animateMotion></circle>
  </g>

  <!-- The switchboard -->
  <circle cx="900" cy="190" r="30" fill="none" stroke="#3ecf8e" stroke-width="2" opacity=".5">
    <animate attributeName="r" values="24;38;24" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".6;0;.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <rect class="node" x="878" y="168" width="44" height="44" rx="10"/>
  <path d="M902 176 l-9 15 h8 l-3 13 10-17 h-8 z" fill="#f2b33d"/>

  <!-- Sources and loads -->
  <g transform="translate(760 70)"><rect class="node" x="-46" y="-26" width="92" height="44" rx="10"/><text class="lbl" y="-8">Solar</text><text class="kw" y="11">34.8 kW</text></g>
  <g transform="translate(650 250)"><rect class="node" x="-48" y="-26" width="96" height="44" rx="10"/><text class="lbl" y="-8">Battery</text><text class="kw" y="11">12.0 kW</text></g>
  <g transform="translate(1110 80)"><rect class="node" x="-44" y="-26" width="88" height="44" rx="10"/><text class="lbl" y="-8">Grid</text><text class="kw" y="11">41.6 kW</text></g>
  <g transform="translate(1090 300)"><rect class="node" x="-56" y="-26" width="112" height="44" rx="10"/><text class="lbl" y="-8">EV chargers</text><text class="kw" y="11">22.0 kW</text></g>
  <g transform="translate(760 320)"><rect class="node" x="-52" y="-26" width="104" height="44" rx="10"/><text class="lbl" y="-8">Heat pump</text><text class="kw" y="11">18.3 kW</text></g>
</svg>
